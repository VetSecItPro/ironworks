name: Release

# SEC-CI-001: default to read-only at workflow level. Per-job blocks below
# upgrade to `contents: write` (tag pushes) or `id-token: write` (npm OIDC)
# only where actually needed (publish_canary, publish_stable).
permissions:
  contents: read

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit SHA, branch, or tag to publish as stable
        required: true
        type: string
        default: master
      stable_date:
        description: Enter a UTC date in YYYY-MM-DD format, for example 2026-03-18. Do not enter a version string. The workflow will resolve that date to a stable version such as 2026.318.0, then 2026.318.1 for the next same-day stable.
        required: false
        type: string
      dry_run:
        description: Preview the stable release without publishing
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_canary:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  publish_canary:
    if: github.event_name == 'push'
    needs: verify_canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-canary
    permissions:
      contents: write
      id-token: write
    # Surface the prior canary version so smoke_canary can roll the dist-tag
    # back if the freshly-published canary fails its post-publish smoke.
    outputs:
      prior_canary_version: ${{ steps.capture_prior.outputs.prior }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore tracked install-time changes
        run: git checkout -- pnpm-lock.yaml

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture prior canary version (pre-publish)
        id: capture_prior
        # Recorded BEFORE we publish so smoke_canary can repoint the canary
        # dist-tag back to the last-known-good version on smoke failure.
        # Empty string is acceptable — no previous canary means no rollback target.
        run: |
          prior="$(npm view ironworksai dist-tags.canary 2>/dev/null || true)"
          echo "Prior canary dist-tag: ${prior:-<none>}"
          echo "prior=${prior}" >>"$GITHUB_OUTPUT"

      - name: Publish canary
        env:
          GITHUB_ACTIONS: "true"
        run: ./scripts/release.sh canary --skip-verify

      - name: Push canary tag
        run: |
          tag="$(git tag --points-at HEAD | grep '^canary/v' | head -1)"
          if [ -z "$tag" ]; then
            echo "Error: no canary tag points at HEAD after release." >&2
            exit 1
          fi
          git push origin "refs/tags/${tag}"

  smoke_canary:
    # Post-publish smoke gate. The canary npm package is already up by the time
    # we get here, so a smoke failure means the canary dist-tag points at a bad
    # build. The rollback step below repoints it to the prior canary version
    # (captured in publish_canary.outputs.prior_canary_version) so consumers
    # pinning `npx ironworksai@canary` get the last-known-good build.
    if: github.event_name == 'push'
    needs: publish_canary
    uses: ./.github/workflows/release-smoke.yml
    with:
      ironworks_version: canary
      artifact_name: release-smoke-canary

  rollback_canary_on_smoke_failure:
    if: github.event_name == 'push' && needs.smoke_canary.result == 'failure' && needs.publish_canary.outputs.prior_canary_version != ''
    needs: [publish_canary, smoke_canary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-canary
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Repoint canary dist-tag to prior canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIOR: ${{ needs.publish_canary.outputs.prior_canary_version }}
        run: |
          echo "Smoke failed for the just-published canary. Repointing canary -> ${PRIOR}"
          # Walk every public workspace package and repoint its canary dist-tag.
          # This mirrors scripts/rollback-latest.sh (which targets the `latest`
          # dist-tag) but for the `canary` channel.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = process.cwd();
            const roots = ["packages", "server", "ui", "cli"];
            const seen = new Set();
            function walk(dir) {
              const abs = path.join(root, dir);
              const pj = path.join(abs, "package.json");
              if (fs.existsSync(pj)) {
                const p = JSON.parse(fs.readFileSync(pj, "utf8"));
                if (!p.private && !seen.has(p.name)) {
                  seen.add(p.name);
                  process.stdout.write(p.name + "\n");
                }
                return;
              }
              if (!fs.existsSync(abs)) return;
              for (const e of fs.readdirSync(abs, { withFileTypes: true })) {
                if (!e.isDirectory()) continue;
                if (["node_modules", "dist", ".git"].includes(e.name)) continue;
                walk(path.join(dir, e.name));
              }
            }
            for (const r of roots) walk(r);
          ' | while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "npm dist-tag add ${pkg}@${PRIOR} canary"
            npm dist-tag add "${pkg}@${PRIOR}" canary || echo "warn: rollback failed for ${pkg}"
          done

      - name: Fail the workflow loudly
        run: |
          echo "::error::Canary smoke failed — canary dist-tag was rolled back to ${{ needs.publish_canary.outputs.prior_canary_version }}. Investigate before promoting to stable."
          exit 1

  verify_stable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  preview_stable:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    needs: verify_stable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Dry-run stable release
        env:
          GITHUB_ACTIONS: "true"
          STABLE_DATE: ${{ inputs.stable_date }}
        run: |
          args=(stable --skip-verify --dry-run)
          if [ -n "$STABLE_DATE" ]; then
            args+=(--date "$STABLE_DATE")
          fi
          ./scripts/release.sh "${args[@]}"

  publish_stable:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    needs: verify_stable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-stable
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@cb9c4fdd700176d874d52d64ce3b7418842cf6d3 # v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Restore tracked install-time changes
        run: git checkout -- pnpm-lock.yaml

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish stable
        env:
          GITHUB_ACTIONS: "true"
          STABLE_DATE: ${{ inputs.stable_date }}
        run: |
          args=(stable --skip-verify)
          if [ -n "$STABLE_DATE" ]; then
            args+=(--date "$STABLE_DATE")
          fi
          ./scripts/release.sh "${args[@]}"

      - name: Push stable tag
        run: |
          tag="$(git tag --points-at HEAD | grep '^v' | head -1)"
          if [ -z "$tag" ]; then
            echo "Error: no stable tag points at HEAD after release." >&2
            exit 1
          fi
          git push origin "refs/tags/${tag}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REMOTE: origin
        run: |
          version="$(git tag --points-at HEAD | grep '^v' | head -1 | sed 's/^v//')"
          if [ -z "$version" ]; then
            echo "Error: no v* tag points at HEAD after stable release." >&2
            exit 1
          fi
          ./scripts/create-github-release.sh "$version"
